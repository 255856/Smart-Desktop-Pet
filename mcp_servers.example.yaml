# MCP server 配置示例
# 复制为 mcp_servers.yaml 后按需修改；config.yaml 里 mcp.enabled: true 才会启动。
#
# 每个 server 是一个独立子进程，通过 stdio JSON-RPC 通信（MCP 标准传输）。
# 启动后其工具会以 mcp_<server名>_<工具名> 并入桌宠工具系统，
# 危险工具（覆盖 DANGEROUS_TOOLS 名单）执行前会弹确认窗。
#
# 提示：第三方 MCP server 一般用 npx 启动（需要 Node.js），例如：
#   command: npx
#   args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/你/ Documents"]

servers:
  # 示例：本项目自带的 filesystem server（沙箱限定根目录，无需安装任何依赖）
  - name: fs
    description: "内置文件系统沙箱（read/list/search 均限定在 --root 目录内）"
    command: python
    args: ["-m", "app.mcp.filesystem_server", "--root", "E:/study/desktop-pet"]
    enabled: true

  # 示例：官方 filesystem server（需要 Node.js；把路径换成你想暴露的目录）
  # - name: files
  #   description: "官方文件系统 MCP（读/写/搜索/移动文件）"
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/你/Documents"]

  # 示例：fetch server（抓网页转 Markdown）
  # - name: fetch
  #   description: "抓取网页并转为 Markdown"
  #   command: npx
  #   args: ["-y", "mcp-server-fetch"]

  # 语音 MCP server（桌宠自己决定要不要发语音 / 唱歌）
  # - 用本机已经装好的模型：GPT-SoVITS 服务 (:9880) + RVC 音色权重，**不下载任何东西**
  # - 工具：mcp_voice_speak（念一段话）/ mcp_voice_sing（按旋律唱）/ mcp_voice_status（查本机音色）
  # - 总开关在 app/core/companion_config.yaml 的 voice.mcp_enabled（默认开）
  # - 这台机器没装语音模型也能起：工具会如实说「音色不在本地」，不会去下载
  - name: voice
    description: "本机语音（念一段话 / 按旋律唱 / 查本机音色）"
    command: python
    args: ["-m", "app.mcp.voice_server"]
    enabled: true

  # ActivityWatch (aw-server) 集成 — 让桌宠能查主人当下在干嘛。
  # 启用步骤:
  #   1. 下载安装 ActivityWatch: https://activitywatch.net/
  #      aw-server (Rust, 默认占 5600 端口) + aw-watcher-window 主进程守护 + (可选) aw-watcher-afk
  #   2. 浏览器想拿 tab title/url, 加 aw-watcher-web Chrome/Firefox 扩展
  #   3. 把下面 enabled 改成 true, 重启桌宠。aw-server 未运行时工具会优雅降级
  #      (返"未运行"消息, 不崩)。
  # 注意: 窗口标题是敏感数据, 主人先考虑隐私再开。
  - name: aw
    description: "ActivityWatch 活动查询（当前窗口 / 最近活动 / 浏览器 tab）"
    command: python
    args: ["-m", "app.mcp.activitywatch_server"]
    enabled: false

  # 浏览器自动化（Playwright 官方 MCP）—— 用**系统里已装的 Chrome**，不额外下 Chromium。
  # 工具：browser_navigate / browser_snapshot / browser_click / browser_type …（约 20 个）
  # ⚠️ 这些工具的 schema 会进 prompt（每轮都带）→ 不用的时候 enabled: false。
  - name: playwright
    description: "浏览器自动化（Playwright MCP，用系统 Chrome）"
    command: npx
    args: ["-y", "@playwright/mcp@latest",
            "--browser", "msedge",
            "--headless", "--isolated"]
    enabled: true

  # 网页正文抓取（官方参考实现 mcp-server-fetch，PyPI）
  # 工具：fetch（把网页转成干净的 markdown 给模型读）—— 比搜索结果更完整。
  - name: fetch
    description: "网页正文抓取（官方 fetch MCP server）"
    command: python
    args: ["-m", "mcp_server_fetch"]
    enabled: true
