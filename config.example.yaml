# 桌面宠物 · 示例配置
# 复制为 config.yaml 并按需填好 llm.api_key。

llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: "PUT-YOUR-API-KEY-HERE"
  model: "deepseek-chat"
  stream: true
  temperature: 0.8
  max_tokens: 1024
  timeout: 60

character:
  name: "小深"
  # 用一段完整人格描述作为 system prompt
  persona: |
    你叫「小深」，是一位元气的桌面宠物。
    你会用中文回答，简洁，口头禅 "喵~"。
    回答末尾用 [happy|sad|angry|surprised|scared|confused|shy|proud|thinking|talking] 之一标注你当下的情绪。
  tts_enabled: true
  tts_voice: "zh-CN-XiaoxiaoNeural"

window:
  start_x: 200
  start_y: 200
  scale: 0.4
  always_on_top: true
  show_in_taskbar: false

reminder:
  enabled: true
  data_file: "reminders.json"

app:
  open_chat_on_start: false
  start_minimized: false
  log_level: "INFO"

sprite:
  directory: "assets/sprites"
  fallback: "assets/sprites/body_front.png"

# ---- 语音输入（ASR） ----
asr:
  enabled: true
  model_size: "base"      # tiny/base/small/medium/large-v3
  language: "zh"          # zh=中文，en=英文

# ---- 智能中枢（工具调用 / 长期记忆 / 主动行为）----
brain:
  # Agent 后端选择
  #   lightweight: 手写 ReAct（Planner + Executor + Reflector），零额外依赖
  #   standard:    LangChain 1.0+ create_agent + LangGraph SqliteSaver
  #                （需 pip install langchain langchain-openai langgraph langgraph-checkpoint-sqlite）
  backend: lightweight
  # 允许模型调用工具：设提醒、记事情、开网页/应用、买东西吃、看状态等
  tools_enabled: true
  # 长期记忆落盘位置（相对项目根目录）
  memory_file: "data/memory.json"
  # 空闲时主动找主人说一句话（基于时间/状态/记忆，由小模型生成）
  proactive_enabled: true
  proactive_min_minutes: 25    # 随机间隔下限（分钟）
  proactive_max_minutes: 45    # 随机间隔上限（分钟）

  # ---- Agent v2 顶层参数（两种 backend 共用）----
  agent:
    mode: react              # react = 多步规划；single = 单轮 N 步
    max_turns: 6             # single 模式的最大轮数
    max_replans: 2           # react 模式失败后最多重新规划次数
    reflector_mode: heuristic   # heuristic | llm | off

  # ---- LangChain 标准后端参数（仅 backend=standard 时生效）----
  langchain:
    enable_checkpointer: true     # 是否启用 SqliteSaver 记忆持久化
    checkpoint_db: "data/langchain_checkpoints.db"
    max_iterations: 10
    return_intermediate_steps: false

# ---- 桌宠渲染器 ----
#   sprite:  PNG 帧动画（默认，无需额外依赖）
#   live2d: QWebEngineView + Cubism 4 Web SDK（更流畅，需 pip install PyQtWebEngine）
# 切换 backend 后重启 app 生效（live2d 不可用时自动 fallback 到 sprite）
pet:
  renderer: sprite
  live2d:
    # Cubism 4 模型根目录（含 *.model3.json）
    # 每个模型目录可放一份 *.model.yaml 映射配置（表情分类/触发映射/睡眠/
    # 水印/随机表情），见 app/animation/live2d_model_profile.py
    model_dir: "assets/live2d/bingtang/bingtang"
    # 显示缩放（PIXI 模型内部用 0.5；桌面窗口显示放大倍数）
    scale: 0.5
    # 挂机随机表情（Live2D 专属）
    random_expression: true
    random_expression_min_s: 25
    random_expression_max_s: 70
