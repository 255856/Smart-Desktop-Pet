<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Live2D Bridge</title>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    overflow: hidden; width: 100%; height: 100%;
  }
  #stage { width: 100vw; height: 100vh; }
  #stage canvas { display: block; }
</style>
</head>
<body>
<div id="stage"></div>

<!--
  本页面由 Live2DRenderer 内置的本地 HTTP 服务提供（与模型资源同源，
  彻底规避 Chromium 的 file:// 跨域限制）。

  加载顺序很重要：
  1. Cubism 4 Core（官方 Live2D 运行时，提供全局 Live2DCubismCore）
  2. pixi.js v7（全局 PIXI）
  3. pixi-live2d-display cubism4 插件（只支持 Cubism 4，不再要求 Cubism 2 core）
-->
<!-- 浏览器环境 polyfill：pixi-live2d-display 的 UMD 包直接引用了 Node 的 process.env.NODE_ENV -->
<script>window.process = window.process || { env: { NODE_ENV: "production" } };</script>
<script src="cubism-sdk/live2dcubismcore.min.js"></script>
<script src="cubism-sdk/pixi.min.js"></script>
<script src="cubism-sdk/cubism4.min.js"></script>
<!-- Qt 内置的 WebChannel 桥（PyQt5 自带该 qrc 资源） -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script>
"use strict";

window.live2d = {
    app: null,
    model: null,
    ready: false,
    expressions: [],
    bridge: null,
    fitFactor: 0.94,   // 模型占画布比例（留一点边距）
    hiddenWatermarkDrawables: [],  // 被隐藏的水印图层 index

    // ---- 跟踪（头/身）参数 ----
    // 为什么需要可配：标准 Live2D 头转参数是 ParamAngleX/Y/Z，pixi 的 focusController
    // 写的也是它。但很多 VTS 风格模型把头绑在**自己的输入参数**上
    // （AngleX/AngleY/AngleZ = OX/OY/OZ），而且物理会把标准参数**覆盖**掉
    // （Cubism 物理的输出是覆盖不是累加）—— 此时写标准参数头身都不动。
    // 模型在 profile 里声明自己的跟踪输入参数后，这里直接写它，
    // 由模型的物理链把它铺到头 → 胸腔 → 肩/盆骨/裙/手臂/尾巴。
    _trackParams: [],   // [{id, gain, axis}]，axis: x | y
    _trackSmooth: {x: 0, y: 0},
    _look: {x: 0, y: 0},   // 最近一次的鼠标归一化偏移（-1~1）
    // 一次性姿态偏移（歪头 / 拖拽 / 走路朝向）：叠加在跟踪值上，到期自动回正。
    // 同样是「归一化」单位（-1~1），由各参数的 gain 换算成模型单位。
    _pose: {x: 0, y: 0, until: 0},
    // 姿态动画（点头/摇头）：叠加在跟踪值上
    _poseAnim: {kind: "", until: 0},
    _lastTrackT: 0,

    // 身体整体跟随鼠标的微倾幅度（弧度，nx=1 时约 ±2.3°），身体为刚性图片时也能看到动。
    // 放在对象上而不是 loadModel 内部 —— focus() 用得到它
    // （之前定义在 loadModel 的局部作用域里，focus() 引用会 ReferenceError 被 try/catch 吞掉，
    //   整体微倾其实从来没生效过）。
    BODY_SWAY: 0.04,

    // 帧率（性能）：交互时 _activeFps，静置 4s 后降到 _idleFps。
    // 透明窗口每帧都要重新合成，桌宠静置时没人看 —— 待机帧率调低能把
    // WebEngine 渲染 + 宿主透明合成这两份开销一起砍掉（实测省一半以上）。
    // _idleFps 由 Python 端下发（loadModel 的第 6 个参数 / setIdleFps），
    // 取值永远 <= _activeFps：用户的「渲染帧率上限」是硬上限，静置也不能超过它。
    _activeFps: 30,
    _idleFps: 12,
    _lastActive: 0,
    _isIdle: false,

    // ---------- QWebChannel ----------
    initBridge() {
        return new Promise((resolve) => {
            if (window.qt && qt.webChannelTransport && window.QWebChannel) {
                new QWebChannel(qt.webChannelTransport, (channel) => {
                    this.bridge = channel.objects.petBridge || null;
                    resolve(this.bridge);
                });
            } else {
                console.warn("QWebChannel transport unavailable; Python callbacks disabled");
                resolve(null);
            }
        });
    },

    _py(method, payload) {
        try {
            if (this.bridge && typeof this.bridge[method] === "function") {
                this.bridge[method](payload);
            }
        } catch (e) {
            console.warn("bridge callback failed:", method, e);
        }
    },

    // ---------- 加载模型 ----------
    // httpBase: 本地 HTTP 服务根地址（如 http://127.0.0.1:54321）
    // settingsName: *.model3.json 的文件名（Python 端 glob 得到，避免硬编码）
    // fitFactor: 0~1，模型在画布中的占比
    // hideWm: 是否隐藏模型自带的 WaterMark 水印图层（默认 true）
    async loadModel(httpBase, settingsName, fitFactor, hideWm, maxFps, idleFps) {
        const base = String(httpBase).replace(/\/+$/, "");
        const settingsUrl = base + "/model/" +
            encodeURIComponent(settingsName).replace(/%2F/g, "/");
        if (fitFactor) this.fitFactor = fitFactor;

        if (!this.app) {
            const stage = document.getElementById("stage");
            // PIXI v7：不要把 div 传给 view（会导致 getContext is not a function），
            // 让 Application 自己创建 canvas，再 append 到容器。
            this.app = new PIXI.Application({
                backgroundAlpha: 0,
                antialias: true,
                autoDensity: true,
                // 分辨率封顶 1.5：高分屏（DPR≥2）全分辨率渲染 GPU/CPU 翻倍，
                // 桌宠小窗肉眼几乎无差，风扇差别很大
                resolution: Math.min(window.devicePixelRatio || 1, 1.5),
                autoStart: true,
                width: stage.clientWidth || 800,
                height: stage.clientHeight || 800,
            });
            stage.appendChild(this.app.view);
            if (PIXI.live2d && PIXI.live2d.Live2DModel &&
                PIXI.live2d.Live2DModel.registerTicker) {
                PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
            }
        }

        if (!PIXI.live2d || !PIXI.live2d.Live2DModel) {
            throw new Error("PIXI.live2d.Live2DModel 未注册（cubism 插件加载失败）");
        }
        if (typeof Live2DCubismCore === "undefined") {
            throw new Error("Live2DCubismCore 未加载（live2dcubismcore.min.js 缺失）");
        }

        try {
            console.log("loading model from:", settingsUrl);
            // from() 直接吃 model3.json 的 URL，内部自动解析 moc3/textures/physics
            this.model = await PIXI.live2d.Live2DModel.from(settingsUrl, {
                autoHitTest: false,
                autoFocus: false,
            });
            this.app.stage.addChild(this.model);

            // 参数/部件保持器：播放动作时 pixi-live2d-display 每帧结尾会
            // loadParameters()，把直接写 core 的参数全部回滚（发型/配件/睡眠
            // 开关因此被待机动作周期性清掉）。监听 beforeModelUpdate（每帧
            // core.update() 之前）重写被保持的参数/部件透明度，动作与外观共存。
            if (!this.__keptHooked) {
                this._keptParams = {};
                this._keptParts = {};
                this.__keptHooked = true;
            }
            const imK = this.model.internalModel;
            // 跟踪参数每帧写（头 + 身体）。afterMotionUpdate 在 motion 之后、
            // saveParameters 之前触发 → 值进参数基线（不会被帧末 loadParameters 抹掉），
            // 且模型的物理链当帧就能读到 → 头动带身体动。
            //
            // ⚠️ 钩子标记必须记在 **internalModel** 上，不能记在 window.live2d 上：
            // 换模型会换一个新的 internalModel，标记留在外层会导致新模型没挂钩子
            // （表现为「鼠标不跟随、身体不动」）。
            if (!imK.__trackHooked) {
                imK.__trackHooked = true;
                imK.on("afterMotionUpdate", () => this._write_track_params());
            }
            imK.on("beforeModelUpdate", () => {
                const core = this.model && this.model.internalModel.coreModel;
                if (!core) return;
                if (this._keptParams) {
                    for (const id in this._keptParams) {
                        core.setParameterValueById(id, this._keptParams[id]);
                    }
                }
                if (this._keptParts) {
                    for (const id in this._keptParts) {
                        try { core.setPartOpacityById(id, this._keptParts[id]); }
                        catch (e) { /* 无此部件 */ }
                    }
                }
                // 口型同步：说话时按时间正弦+随机抖动开合嘴巴
                // （此钩子在每帧 core.update 前，写入必定被渲染）
                if (this._talking && this._talkParam) {
                    const t = performance.now();
                    const v = Math.max(0, Math.sin(t / 80)) *
                              (0.3 + 0.6 * Math.abs(Math.sin(t / 620)));
                    try {
                        core.setParameterValueById(this._talkParam, v);
                        this._lastMouth = v;
                    } catch (e) { /* 无此参数 */ }
                }
            });

            // 修复 mask 组数超限：Cubism WebGL 渲染器默认 1 张 mask 渲染纹理
            //（最多 36 个裁剪组）。部分模型（如超频猫猫）裁剪组超过上限，超出
            // 的裁剪失效 → 本应被裁掉的防盗水印/说明卡整片显示。这里按使用
            // mask 的 drawable 数量估算所需纹理数并重新初始化渲染器。
            try {
                const im0 = this.model.internalModel;
                const core0 = im0.coreModel;
                if (core0.isUsingMasking && core0.isUsingMasking()) {
                    const counts = core0.getDrawableMaskCounts();
                    const using = counts.reduce((a, c) => a + (c > 0 ? 1 : 0), 0);
                    const need = Math.max(1, Math.ceil(using / 32));
                    const cur = im0.renderer.getRenderTextureCount ?
                        im0.renderer.getRenderTextureCount() : 1;
                    if (need > cur) {
                        im0.renderer.initialize(core0, need);
                        console.log("re-init renderer: renderTextureCount", cur, "->", need);
                    }
                }
            } catch (err) {
                console.warn("re-init renderer (mask count) failed:", err);
            }

            // 枚举表情
            this.expressions = [];
            try {
                const defs = (this.model.internalModel.settings.expressions) || [];
                for (const e of defs) {
                    const name = e.Name !== undefined ? e.Name : e.name;
                    if (name) this.expressions.push(name);
                }
            } catch (err) {
                console.warn("enumerate expressions failed:", err);
            }

            // 隐藏免费模型自带的 WaterMark 水印图层（可由 hideWm=false 关闭）
            if (hideWm !== false) {
                try {
                    const n = this.hideWatermark();
                    console.log("hidden watermark drawables:", n);
                } catch (err) {
                    console.warn("hideWatermark failed:", err);
                }
            }

            this.fit();
            this.ready = true;
            // 渲染帧率封顶（性能）：Live2D 待机 30fps 足够顺滑，rAF 满帧（60/144）
            // 只会让 GPU/CPU 空转、风扇狂转
            this._activeFps = this._setFps(
                (maxFps === undefined || maxFps === null) ? 30 : maxFps);
            // 静置帧率：不能超过用户给的上限（min）
            this._idleFps = Math.max(5, Math.min(
                (idleFps === undefined || idleFps === null)
                    ? this._activeFps : Number(idleFps),
                this._activeFps));
            this._lastActive = performance.now();
            this._init_idle_watch();
            console.log("Live2D model loaded, expressions:", this.expressions);
            this._py("onReady", JSON.stringify(this.expressions));
        } catch (err) {
            console.error("loadModel failed:", err);
            this._py("onError", String(err && (err.stack || err.message || err)));
            throw err;
        }
    },

    // 设置渲染帧率。
    //
    // ⚠️ PIXI v7 的坑：`ticker.maxFPS = x` 的 setter 写法是
    //    `set maxFPS(t) { e = Math.max(this.minFPS, t); _minElapsedMS = 1/(e/1000) }`
    // —— **只会取大**。先设 30fps 再设 12fps，它会因为 minFPS=30
    // 而继续保持在 30fps（降不下来）。所以必须先把 **minFPS**
    // 压下去（它控制 _maxElapsedMS），再设 maxFPS（它控制真正的帧间隔）。
    _setFps(fps) {
        const v = Math.max(5, Math.min(60, Number(fps) || 30));
        try {
            const t = this.app && this.app.ticker;
            if (!t) return v;
            t.minFPS = v;     // 先压下限（否则后面的 maxFPS 设不下来）
            t.maxFPS = v;     // 再设真正的帧率上限
        } catch (e) { /* 旧版 ticker 无这两个属性 */ }
        return v;
    },

    // ---------- 缩放 / 居中 ----------
    fit() {
        if (!this.model || !this.app) return;
        const im = this.model.internalModel;
        const origW = im.originalWidth || this.model.width;
        const origH = im.originalHeight || this.model.height;
        const w = this.app.screen.width;
        const h = this.app.screen.height;
        const scale = Math.min(w / origW, h / origH) * this.fitFactor;
        this.model.scale.set(scale);
        try {
            this.model.anchor.set(0.5, 0.5);
        } catch (e) { /* anchor 可选 */ }
        this.model.x = w / 2;
        this.model.y = h / 2;
    },

    // ---------- 隐藏模型自带版权/防盗水印图层 ----------
    // 免费模型（冰糖）在角色身上烘焙了两类水印，且默认强制显示、无法通过参数关闭：
    //   (A) 名字含 WaterMark 的独立图层（“禁止二传 / Bilibili ONLY”版权卡片）；
    //   (B) 伪装成普通 ArtMesh 的全屏文字条（FREE MODEL / 神宫凉子 / UID 等）。
    // 该渲染器不经过 PIXI 显示树（model.children 为空、无 mesh 对象），
    // 因此在 renderer.drawMesh 的“主绘制 pass”直接跳过这些 drawable，
    // 不改动模型文件与贴图，只在渲染层生效。
    hideWatermark() {
        if (!this.model) return 0;
        const im = this.model.internalModel;
        const core = im && im.coreModel;
        const rd = im && im.renderer;
        if (!core || !core.getDrawableIds || !rd || !rd.drawMesh) return 0;

        const ids = core.getDrawableIds();
        const hidden = new Set();

        // (A) 通用：所有名字含 WaterMark 的独立水印图层
        for (let i = 0; i < ids.length; i++) {
            if (/watermark/i.test(String(ids[i]))) hidden.add(i);
        }

        // (B) 冰糖模型特定的文字 overlay（伪装成 ArtMesh*）。
        // 通过 drawMesh 二分定位得到的固定 index，仅在“模型指纹”（drawable 数量 +
        // 关键 id）完全匹配时启用，换用其它模型不会误杀正常部件。
        const BT = {
            count: 694,
            indices: [682, 683, 688, 691, 692, 693],
            expect: {
                682: "ArtMesh2", 683: "ArtMesh23", 684: "WaterMark5",
                688: "ArtMesh18", 691: "ArtMesh24", 692: "ArtMesh25",
                693: "ArtMesh",
            },
        };
        let fingerprint = false;
        if (ids.length === BT.count) {
            fingerprint = true;
            for (const k of Object.keys(BT.expect)) {
                if (String(ids[k]) !== BT.expect[k]) { fingerprint = false; break; }
            }
        }
        if (fingerprint) {
            for (const i of BT.indices) hidden.add(i);
        } else {
            console.warn("[Live2D] watermark fingerprint mismatch; only name-based WaterMark layers hidden");
        }
        this.hiddenWatermarkDrawables = Array.from(hidden).sort((a, b) => a - b);

        // 已包装过：仅更新隐藏集合（同一 renderer 上重复调用的情况）
        if (rd.__wmHidden) {
            rd.__wmHidden = hidden;
            return hidden.size;
        }
        if (hidden.size === 0) return 0;

        rd.__wmHidden = hidden;
        const visibleList = [];
        // 每个 renderer 只包装一次；模型重新加载会产生新 renderer，无需还原。
        const origDoDraw = rd.doDrawModel.bind(rd);
        rd.doDrawModel = function () {
            visibleList.length = 0;
            try {
                const sorted = rd._sortedDrawableIndexList;
                const isVisible = core.getDrawableDynamicFlagIsVisible.bind(core);
                if (sorted) {
                    for (let i = 0; i < sorted.length; i++) {
                        const idx = sorted[i];
                        if (isVisible(idx)) visibleList.push(idx);
                    }
                }
            } catch (e) { /* 计数失败时退化为不拦截，保证角色正常渲染 */ }
            rd.__wmMainCount = 0;
            return origDoDraw();
        };
        const origDraw = rd.drawMesh.bind(rd);
        rd.drawMesh = function () {
            // 仅在“主绘制 pass”（非离屏蒙版 pass，即 getClippingContextBufferForMask()==null）
            // 按本帧可见序列映射到 drawable index；蒙版 pass 照常绘制，不破坏其它部件的裁剪。
            if (rd.getClippingContextBufferForMask &&
                rd.getClippingContextBufferForMask() == null) {
                const idx = visibleList[rd.__wmMainCount || 0];
                rd.__wmMainCount = (rd.__wmMainCount || 0) + 1;
                if (idx != null && rd.__wmHidden.has(idx)) {
                    return;  // 跳过水印 drawable
                }
            }
            return origDraw.apply(rd, arguments);
        };
        return hidden.size;
    },

    // ---------- 表情 / 动作 ----------
    // 播放模型 model3.json 已注册的内置表情（*.exp3.json），走官方 ExpressionManager。
    setExpression(name) {
        if (!this.model) return false;
        try {
            this.model.expression(name);
            this.markActive();
            return true;
        } catch (e) {
            console.warn("setExpression failed:", name, e);
            return false;
        }
    },

    // 统一获取 ExpressionManager（Cubism4 标准路径：internalModel.motionManager.expressionManager）
    _expressionManager() {
        try {
            const im = this.model && this.model.internalModel;
            return im && im.motionManager && im.motionManager.expressionManager;
        } catch (e) {
            return null;
        }
    },

    // 播放“模型 exp3 之外”的自定义表情（吐舌/鼓腮/吃饭/思考/触摸等模型本就支持、
    // 但没有注册成表情文件的参数）。按 name 缓存，只在首次注册一次。
    //   params : [{Id, Value, Blend}](Blend 取 Add/Multiply/Overwrite，默认 Add)
    //   fadeIn/fadeOut : 淡入淡出秒数
    // 返回 Promise<true/false>。
    async playCustomExpression(name, params, fadeIn, fadeOut) {
        const em = this._expressionManager();
        if (!em || !em.createExpression) return false;
        if (!this._customIndex) this._customIndex = {};
        try {
            let idx = this._customIndex[name];
            if (idx === undefined) {
                const payload = {
                    Type: "Live2D Expression",
                    FadeInTime: (fadeIn === undefined || fadeIn === null) ? 0.12 : fadeIn,
                    FadeOutTime: (fadeOut === undefined || fadeOut === null) ? 0.3 : fadeOut,
                    Parameters: (params || []).map((p) => ({
                        Id: String(p.Id),
                        Value: Number(p.Value),
                        Blend: p.Blend || "Add",
                    })),
                };
                const expr = em.createExpression(payload);
                idx = em.definitions.length;
                em.definitions.push({ Name: name, File: name });
                // 注意：expressions 是按 index 对齐的稀疏数组，必须用下标直接赋值，
                // 不能 push（push 会从 index 0 放，导致之后 setExpression 按旧下标
                // 去网络加载一个不存在的文件而 404）。
                em.expressions[idx] = expr;
                this._customIndex[name] = idx;
            }
            return await em.setExpression(idx);
        } catch (e) {
            console.warn("playCustomExpression failed:", name, e);
            return false;
        }
    },

    // 恢复自然表情（ExpressionManager 回到空的 defaultExpression）。
    // 不影响发型之类用 applyParams 直接写的开关参数。
    resetExpressionState() {
        const em = this._expressionManager();
        if (em && typeof em.resetExpression === "function") {
            try {
                em.resetExpression();
                // resetExpression 只是把 default 放进播放队列，并不会更新
                // currentExpression 引用（它仍指向上一个情绪）。若不同步，
                // 之后再点回“上一个情绪”时，会被 setExpression 里
                // `t===indexOf(currentExpression)` 的去重判断拦截、点了没反应。
                if (em.defaultExpression) em.currentExpression = em.defaultExpression;
                return true;
            } catch (e) { /* ignore */ }
        }
        return false;
    },

    setParam(name, value, durationMs) {
        if (!this.model) return;
        durationMs = durationMs || 0;
        const core = this.model.internalModel && this.model.internalModel.coreModel;
        if (!core) return;
        try {
            if (durationMs <= 0) {
                core.setParameterValueById(name, value);
            } else {
                const startVal = core.getParameterValueById(name);
                const startTime = performance.now();
                const tick = () => {
                    if (!this.model) return;
                    const t = Math.min(1, (performance.now() - startTime) / durationMs);
                    core.setParameterValueById(name, startVal + (value - startVal) * t);
                    if (t < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }
        } catch (e) {
            console.warn("setParam failed:", name, e);
        }
    },

    // 直接、立即、持久地应用一组"外观参数"（发型 / 头饰 / 表情开关 / 睡眠开关）。
    // 与 setExpression 不同：它绕过 ExpressionManager，直接写 core 参数。
    // 有动作播放时每帧结尾 loadParameters() 会回滚直接写入，因此写入的参数
    // 同时记入 _keptParams，由 beforeModelUpdate 钩子每帧重写（见 loadModel）。
    //   resetIds : 这些参数先归零（清掉上一组外观，如换发型前的旧发型开关）
    //   paramMap : 再设置成 {参数Id: 值}
    applyParams(resetIds, paramMap) {
        if (!this.model) return false;
        const core = this.model.internalModel && this.model.internalModel.coreModel;
        if (!core) return false;
        if (!this._keptParams) this._keptParams = {};
        try {
            (resetIds || []).forEach((id) => {
                try { core.setParameterValueById(String(id), 0); } catch (e) { /* 无此参数 */ }
                delete this._keptParams[String(id)];
            });
            Object.keys(paramMap || {}).forEach((id) => {
                const v = Number(paramMap[id]);
                try { core.setParameterValueById(String(id), v); }
                catch (e) { /* 无此参数 */ }
                this._keptParams[String(id)] = v;
            });
            this.markActive();
            return true;
        } catch (e) {
            console.warn("applyParams failed:", e);
            return false;
        }
    },

    // 按部件 ID 设置透明度并持久保持（如隐藏水印部件 Part14）。
    // 与参数同理：部件透明度也会被动作每帧回滚，记入 _keptParts 每帧重写。
    //   ids : 部件 ID 数组（cdi3.json Parts[].Id）
    //   opacity : 目标透明度（0=隐藏，1=显示）
    hideParts(ids, opacity) {
        if (!this.model) return false;
        const core = this.model.internalModel && this.model.internalModel.coreModel;
        if (!core) return false;
        if (!this._keptParts) this._keptParts = {};
        const v = (opacity === undefined || opacity === null) ? 0 : Number(opacity);
        (ids || []).forEach((id) => {
            try { core.setPartOpacityById(String(id), v); } catch (e) { /* 无此部件 */ }
            this._keptParts[String(id)] = v;
        });
        this.markActive();
        return true;
    },

    // 恢复自然表情：走官方 ExpressionManager.resetExpression()。
    // 可选 extraResetIds：额外把这些直接写参数的临时开关归零（如需要）。
    resetExpression(extraResetIds) {
        if (!this.model) return false;
        const ok = this.resetExpressionState();
        const core = this.model.internalModel && this.model.internalModel.coreModel;
        (extraResetIds || []).forEach((id) => {
            try { core && core.setParameterValueById(String(id), 0); } catch (e) { /* ignore */ }
        });
        return ok;
    },

    playMotion(group, index) {
        if (!this.model) return;
        try {
            if (!this.model.motion) return;
            // index 未指定时随机选一个（model.motion(group) 本身支持随机）
            if (index === undefined || index === null) {
                this.model.motion(group);
            } else {
                this.model.motion(group, index);
            }
            // 动作播放期间保持高帧（动作一般 1-5s），3.5s 后解除 busy
            this._motionBusy = true;
            this.markActive();
            if (this._motionBusyTimer) clearTimeout(this._motionBusyTimer);
            this._motionBusyTimer = setTimeout(() => { this._motionBusy = false; }, 3500);
        } catch (e) {
            console.warn("playMotion failed:", group, e);
        }
    },

    // 停止全部动作（睡觉时先停待机动作，防止每帧覆写睡眠参数）
    stopMotions() {
        if (!this.model) return;
        try {
            const mm = this.model.internalModel && this.model.internalModel.motionManager;
            if (mm && mm.stopAllMotions) mm.stopAllMotions();
        } catch (e) { /* ignore */ }
    },

    startDrag(x, y) {
        if (!this.model) return;
        try {
            const dm = this.model.internalModel.dragManager;
            if (dm) dm.set(x * this.app.screen.width, y * this.app.screen.height);
            this.markActive();   // 拖拽期间保持高帧
        } catch (e) { /* ignore */ }
    },

    // 设置模型自己的跟踪输入参数（由 profile 传入）。
    // list: [{id: "AngleX", gain: 25, axis: "x"}, ...]
    setTrackParams(list, eyes) {
        const norm = (p, defAxis) => ({
            id: String(p.id),
            gain: (p.gain === undefined || p.gain === null) ? 25 : Number(p.gain),
            axis: String(p.axis || defAxis),
            // 正负号：鼠标 Y 是「向下为正」，而不同模型的头部俯仰/眼球参数正方向不一样
            // （大肥鱼的 AngleY、ParamEyeBallY 都是向上为正 → 需要 -1 才不会上下颠倒）
            sign: (p.sign === undefined || p.sign === null)
                ? 1 : (Number(p.sign) < 0 ? -1 : 1),
        });
        this._trackParams = (Array.isArray(list) ? list : [])
            .filter(p => p && p.id).map(p => norm(p, "x"));
        // 眼球：默认标准参数（ParamEyeBallX/Y），模型可自带覆盖与方向
        const eyeList = Array.isArray(eyes) && eyes.length ? eyes : [
            {id: "ParamEyeBallX", axis: "x"},
            {id: "ParamEyeBallY", axis: "y"},
        ];
        this._eyeParams = eyeList.filter(p => p && p.id).map(p => norm(p, "x"));
        console.log("[Live2D] track params:", JSON.stringify(this._trackParams),
                    "eyes:", JSON.stringify(this._eyeParams));
        return this._trackParams.length;
    },

    // 每帧写跟踪参数。
    //
    // 为什么必须每帧写、且写在 afterMotionUpdate：
    //   * 写在 afterMotionUpdate（motion 之后、saveParameters 之前）→ 值会进参数基线，
    //     既不会被帧末的 loadParameters() 抹掉，模型的物理链当帧就能读到；
    //   * 物理链是模型自己的：跟踪输入 → ParamAngleX/Y/Z（头）→ ParamBodyAngleX/Y/Z
    //     （胸腔）→ 肩/盆骨/裙摆/手臂/尾巴，一整套身体跟着动。
    //   * 每帧写的是「鼠标位置 + 一次性姿态偏移」，**没有任何自主动作**：
    //     鼠标不动 → 模型不动（模型自带的呼吸/尾巴摆动是它自己的物理，不算）。
    _write_track_params() {
        const im = this.model && this.model.internalModel;
        const core = im && im.coreModel;
        if (!core) return;
        const now = performance.now();
        // 时间基平滑：帧率无关（30fps 交互 / 12fps 静置 手感一致），也不会因
        // 掉帧而突然跳一大截。
        const dt = this._lastTrackT
            ? Math.min(0.2, (now - this._lastTrackT) / 1000) : 0.016;
        this._lastTrackT = now;
        const s = this._trackSmooth;
        const l = this._look;
        const k = 1 - Math.exp(-dt / 0.09);   // 时间常数 ~90ms
        s.x += (l.x - s.x) * k;
        s.y += (l.y - s.y) * k;

        // 待机摇摆：**不要**。鼠标不动时模型就该静止（用户明确要求「只跟随鼠标」）。
        // 之前这里加的正弦摇摆会让角色自己左右晃 —— 看着像在跟鼠标抢控制权。
        // 模型自带的呼吸（pixi breath → ParamBreath → 胸腔起伏）保留，那是自然的呼吸。

        // 一次性姿态偏移到期回正（拖拽歪头 / 摸头反应）
        const po = this._pose;
        if (po.until && now > po.until) { po.x = 0; po.y = 0; po.until = 0; }

        // 姿态动画（点头 / 摇头）：叠加在跟踪值上。
        // 不走模型自带 motion —— motion 动的是模型参数，会和这里的每帧写入互相覆盖。
        const t = now / 1000;
        const pa = this._poseAnim;
        let animX = 0, animY = 0;
        if (pa.kind) {
            if (now < pa.until) {
                if (pa.kind === "nod") animY = Math.sin(t * 8.5) * 0.30;
                else if (pa.kind === "shake") animX = Math.sin(t * 10.5) * 0.26;
                else if (pa.kind === "tilt") animX = 0.28;
            } else {
                pa.kind = "";
            }
        }
        // 没有自定义跟踪参数时，姿态动画退回标准头参数
        // （pixi 的 focusController 是「加」上去的，所以点头是叠在鼠标跟随之上的）。
        if (!this._trackParams.length) {
            if (animX || animY) {
                try { core.setParameterValueById("ParamAngleX", animX * 30); }
                catch (e) { }
                try { core.setParameterValueById("ParamAngleY", animY * 30); }
                catch (e) { }
            }
            return;
        }

        // 跟踪值 = 鼠标位置（平滑后）+ 一次性姿态偏移 + 姿态动画。
        // 没有任何自主动作 —— 鼠标不动，模型就不动。
        const baseX = s.x + po.x + animX;
        const baseY = s.y + po.y + animY;
        for (const p of this._trackParams) {
            let v;
            if (p.axis === "y") {
                v = baseY * p.gain * p.sign;
            } else if (p.axis === "z") {
                // 侧倾：斜着看时才转（对齐 pixi 的 ParamAngleZ = x*y*-30）
                v = (s.x * s.y) * -p.gain;
            } else {
                v = baseX * p.gain * p.sign;
            }
            try { core.setParameterValueById(p.id, v); }
            catch (e) { /* 模型没有这个参数 */ }
        }
        // 眼球：按模型配置写（方向跟头一样按 sign 翻 —— 有些模型眼球 Y 是向上为正）
        for (const p of (this._eyeParams || [])) {
            const v = (p.axis === "y")
                ? (s.y + po.y + animY) * p.gain * p.sign
                : (s.x + po.x + animX) * p.gain * p.sign;
            try { core.setParameterValueById(p.id, v); }
            catch (e) { /* 模型没有这个参数 */ }
        }
    },

    // 姿态动画：点头 / 摇头 / 歪头。直接叠加在跟踪值上，
    // 不与模型自带 motion 抢参数（motion 会在每帧覆盖同名参数）。
    playPoseAnim(kind, ms) {
        this._poseAnim.kind = String(kind || "");
        this._poseAnim.until = performance.now() + (Number(ms) || 0);
        return true;
    },

    // 一次性姿态偏移：歪头 / 拖拽 / 走路朝向。
    // dx、dy 是归一化单位（-1~1）；holdMs > 0 时到期自动回正，0 = 一直保持。
    setPose(dx, dy, holdMs) {
        this._pose.x = Number(dx) || 0;
        this._pose.y = Number(dy) || 0;
        this._pose.until = (holdMs && holdMs > 0)
            ? performance.now() + Number(holdMs) : 0;
        return true;
    },

    focus(nx, ny) {
        if (!this.model) return;
        nx = Math.max(-1, Math.min(1, Number(nx) || 0));
        ny = Math.max(-1, Math.min(1, Number(ny) || 0));
        this._look.x = nx;
        this._look.y = ny;

        if (!this._trackParams.length) {
            // 默认路径：pixi 的 focusController（写标准 ParamAngleX/Y/Z + 眼球）
            try {
                const w = this.app ? this.app.screen.width : 0;
                const h = this.app ? this.app.screen.height : 0;
                this.model.focus(w / 2 + nx * w / 2,
                                 h / 2 + ny * h / 2);
            } catch (e) { /* 旧版 API 无 focus */ }
        }
        // 整体微倾只对「身体是刚性」的模型有意义。
        // 模型有自己的跟踪参数时，身体已经通过绑定动了（头/胸/肩/裙/手臂/尾），
        // 再整体旋转等于让脚在地上滑 —— 所以关掉。
        try {
            if (this.model && !this._trackParams.length) {
                this.model.rotation = this._look.x * this.BODY_SWAY;
            }
        } catch (e) { /* ignore */ }
    },

    resize(w, h) {
        if (this.app) {
            this.app.renderer.resize(w, h);
            this.fit();
        }
    },

    // 暂停/恢复渲染（桌宠隐藏时完全停掉 ticker：零 GPU/CPU）
    pause() {
        try { if (this.app) this.app.ticker.stop(); } catch (e) { /* ignore */ }
    },
    resume() {
        try {
            if (this.app) {
                this.app.ticker.start();
                // 重置闲置状态：重新给 4s 宽限评估，避免恢复后仍停在低帧/mask
                this._isIdle = false;
                this._setFps(this._activeFps);
                this._lastActive = performance.now();
                this._py("onIdleExit", "1");
            }
        } catch (e) { /* ignore */ }
    },

    // 运行时调整渲染帧率上限（设置面板 Live2D 页）
    setMaxFps(fps) {
        try {
            if (this.app) {
                const v = Math.max(5, Number(fps) || 30);
                this._activeFps = v;
                // 静置时立即生效（否则下次恢复会回到旧值）
                this._idleFps = Math.max(5, Math.min(this._idleFps, v));
                this._setFps(this._isIdle ? this._idleFps : v);
            }
        } catch (e) { /* ignore */ }
    },

    // 运行时调整**静置**帧率上限（没人看它的那段时间）
    setIdleFps(fps) {
        const v = Math.max(5, Number(fps) || 0);
        this._idleFps = Math.max(5, Math.min(v, this._activeFps));
        try {
            if (this.app && this._isIdle) this._setFps(this._idleFps);
        } catch (e) { /* ignore */ }
    },

    // ---- 闲置降帧 ----
    _init_idle_watch() {
        if (this._idleWatching) return;
        this._idleWatching = true;
        // 鼠标交互（移动 / 进入 / 按下 / 拖拽）都标记活跃
        const mark = () => this.markActive();
        const stage = document.getElementById("stage");
        const targets = [window, stage];
        for (const el of targets) {
            if (!el) continue;
            el.addEventListener("pointermove", mark, { passive: true });
            el.addEventListener("pointerdown", mark, { passive: true });
            el.addEventListener("pointerenter", mark, { passive: true });
            el.addEventListener("dragstart", mark, { passive: true });
        }
        // 每帧检测：静置超时则降帧；说话/动作期间保持高帧
        this.app.ticker.add(() => {
            const busy = this._talking || this._motionBusy;
            if (this._isIdle) {
                if (busy) this.markActive();
                return;
            }
            if (!busy && performance.now() - this._lastActive > 4000) {
                this._isIdle = true;
                this._setFps(this._idleFps);
                this._py("onIdleEnter", "1");   // 通知 python 停 mask 采样
            }
        });
    },

    markActive() {
        const wasIdle = this._isIdle;
        this._lastActive = performance.now();
        if (wasIdle) {
            this._isIdle = false;
            this._setFps(this._activeFps);
            this._py("onIdleExit", "1");    // 通知 python 恢复 mask 采样
        }
    },

    // 口型同步：说话期间每帧开合嘴巴（param 如 ParamMouthOpenY）
    startTalk(param) {
        this._talkParam = String(param || "ParamMouthOpenY");
        this._talking = true;
        this.markActive();
    },
    stopTalk() {
        this._talking = false;
        this.markActive();
        try {
            if (this.model && this._talkParam) {
                this.model.internalModel.coreModel
                    .setParameterValueById(this._talkParam, 0);
            }
        } catch (e) { /* ignore */ }
    },

    shutdown() {
        if (this.model) {
            try {
                this.app.stage.removeChild(this.model);
                this.model.destroy();
            } catch (e) { /* ignore */ }
            this.model = null;
        }
        if (this.app) {
            try { this.app.destroy(true, { children: true, texture: true }); }
            catch (e) { this.app.destroy(true); }
            this.app = null;
        }
        this.ready = false;
    }
};

// 页面加载后立即建立桥，然后等待 Python 调用 loadModel
window.addEventListener("DOMContentLoaded", () => {
    window.live2d.initBridge().then(() => {
        console.log("live2d bridge ready; pixi:",
            typeof PIXI !== "undefined" ? PIXI.VERSION : "missing",
            "core:", typeof Live2DCubismCore !== "undefined",
            "plugin:", !!(PIXI.live2d && PIXI.live2d.Live2DModel));
        // 桥就绪了：告诉 Python “现在可以 loadModel”。
        // 之前只能盲等固定的 400ms（不知道桥什么时候就绪），
        // 启动时那 400ms 是纯浪费（白等一个浏览器进程启动）。
        window.live2d._py("onBridgeReady", "1");
    });
});
</script>
</body>
