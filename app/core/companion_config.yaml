# 桌宠养成数值配置 (v23-2 创新点 2 数值参数化)
#
# 主人 2026-10-16 反馈: 数值 + 范围 + 公式 + 钩子权重都要走 yaml, 不要 hardcode.
#
# 用户覆盖路径: data/companion_config.yaml (不提交, 本地调试).
#
# 字段说明:
#   ranges: 各维度 [minimum, maximum, initial]
#   quantize: 三档离散化阈值 (LOW/MID/HIGH 分界 + hysteresis 防抖)
#   leveling: 升级公式 base * level^exp
#   time_decay: 时间驱动衰减 (每小时减饱食度 等)
#   event_hooks: 事件驱动钩子 (per-run 颗粒, 任务成功/失败 + 用户确认/拒绝 + 喂食/互动)
#   favor_rules: 好感维度额外规则 (替换原 trust 维度, 主人 2026-10-16 加)
#   persistence: 数值持久化
#   trace: trace 日志

satiety:
  minimum: 0
  maximum: 100
  initial: 80          # 饱食度初始值 (日志.txt)

mood:
  minimum: 0
  maximum: 100
  initial: 70          # 心情初始值 (日志.txt)

level:
  minimum: 1
  maximum: 10          # 等级上限 10
  initial: 1

favor:                 # 好感 (主人 2026-10-16 用好感替换信任度)
  minimum: 0
  maximum: 100
  initial: 50

quantize:
  low_below: 33        # <33 → LOW
  mid_below: 67        # <67 → MID, 否则 HIGH
  hysteresis_low_to_mid: 40    # prev=LOW 时涨到 40 才回 MID (防抖)
  hysteresis_high_to_mid: 60   # prev=HIGH 时跌到 60 才回 MID (防抖)

leveling:
  base: 100
  exp: 1.5             # 升级公式 100 * level^1.5 (主人日志.txt)
  max_level: 10
  exp_per_success: 20          # 任务成功 +20 EXP (日志.txt)
  exp_per_accepted: 15         # 采纳 +15 EXP (日志.txt)
  exp_per_positive_feedback: 15
  exp_per_continuous_7d: 50    # 连续使用 7 天 +50 EXP (日志.txt)

time_decay:
  satiety_per_hour: -0.833            # 24h -20 折算 per hour
  mood_no_interact_48h: -5            # 主人 48h 不互动 -5 心情 (日志.txt)
  mood_low_satiety_extra_per_24h: -5  # 饱食<30 时每 24h 额外扣
  check_interval_seconds: 600         # 主循环检查周期 (10 分钟)

# 事件驱动钩子 (per-run 颗粒, 主人 2026-10-16 选 per-run)
# 默认值取自 E:\study\日志.txt:
#   - 任务成功: 心情 +8, 经验 +20, 好感 +1
#   - 任务失败: 心情 -12, 好感 -3
#   - 用户拒绝: 心情 -10, 好感 -2
#   - 用户采纳: 心情 +6, 好感 +3
#   - 用户喂食: 饱食 +15, 心情 +5
#   - 用户互动: 心情 +3, 好感 +2
event_hooks:
  task_success:
    satiety: 0
    mood: 8
    favor: 1
    exp: 20
  task_failure:
    satiety: 0
    mood: -12
    favor: -3
    exp: 0
  user_rejected:
    satiety: 0
    mood: -10
    favor: -2
    exp: 0
  user_accepted:
    satiety: 0
    mood: 6
    favor: 3
    exp: 0
  user_feed:
    satiety: 15
    mood: 5
    favor: 0
    exp: 0
  user_interact:
    satiety: 0
    mood: 3
    favor: 2
    exp: 0

# 好感维度额外规则 (主人 2026-10-16 加, 替换 trust)
# 当桌宠好感 ≥ high_threshold 时主人长期信任, 高风险工具可额外 ALLOW
# 当桌宠好感 < low_threshold 时未建立信任关系, 任意 MEDIUM+ 都需 CONFIRM
favor_rules:
  high_threshold: 80
  low_threshold: 30
  high_allows_irreversible: false    # 即使好感 ≥80, 不可逆仍 confirm (不可逆就是不可逆)
  low_forces_confirm_medium: true    # 好感 <30 时, MEDIUM 也 confirm

# 数值持久化
persistence:
  file: data/pet_state.json
  write_on_update: true              # 每次 update 后立刻写盘
  write_min_interval_seconds: 5      # 防抖: 短时间内多次更新只写一次

# trace 日志 (v23-1 接好, v23-7 加 UI)
trace:
  enabled: true
  log_file: data/companion_log.txt
  max_lines_in_memory: 500           # trace 页读盘后保留多少行

# 工具解锁 (v37+ 战令式工具解锁)
# 设计原则:高频低风险工具放前面(让用户先能体验),按模块划分
# Lv1 默认解锁 ~35 个基础工具,后续每升 1 级解锁 2-6 个
# MCP server 加载的外部工具默认锁到 Lv8
# 解锁顺序参考工具风险等级 TOOL_RISK_LEVEL (SAFE 早, IRREVERSIBLE 晚)
tool_unlock:
  levels:
    1:  # 基础体验 (35 个) - 全部 SAFE + LOW + 部分桌面操作
      - get_current_time          # 时间
      - get_weather               # 天气
      - date_info                 # 日期/农历
      - calculate                 # 计算
      - convert_units             # 单位换算
      - get_pet_status            # 桌宠状态
      - play_animation            # 播动画
      - change_pet_emotion        # 切换表情
      - say_to_user               # 主动搭话
      - feed_self                 # 喂食
      - take_screenshot_tool      # 截图
      - read_file                 # 读文件
      - read_text_file            # 读文本
      - list_desktop_files        # 列出桌面文件
      - open_app                  # 打开应用
      - open_website              # 打开网页
      - open_terminal             # 打开终端
      - open_file_explorer        # 打开文件管理器
      - open_notepad              # 打开记事本
      - system_info               # 系统信息
      - list_installed_apps       # 已装应用
      - list_processes            # 进程列表
      - get_battery               # 电池
      - search_files              # 文件名搜索
      - glob_files                # glob 匹配
      - grep_files                # grep
      - ocr_image                 # OCR
      - understand_image          # 图像理解
      - recall_memory             # 查记忆
      - unmute_tts                # 取消静音
      - get_tts_mute_status       # 静音状态
      - get_volume                # 音量查询
      - get_brightness            # 亮度查询
      - get_clipboard             # 剪贴板查询
      - clear_bubble              # 清气泡
    2:  # 联网能力 (2 个)
      - web_search
      - fetch_url_text
    3:  # 系统写 + 提醒查询 (6 个)
      - set_volume
      - set_brightness
      - set_tts_mute_until
      - clipboard_copy
      - list_reminders
      - list_countdowns
    4:  # 文件编辑 + 提醒设置 (4 个)
      - edit_file
      - multi_edit
      - add_reminder
      - delete_reminder
    5:  # 记忆写 + 子智能体 (3 个)
      - remember_fact
      - forget_memory
      - Task
    6:  # 计时器 (2 个)
      - countdown
      - cancel_countdown
    7:  # 多媒体生成 (2 个)
      - generate_image
      - generate_audio
    8:  # 高级生成 + MCP 工具 (1 个内建 + 全部 MCP 外部)
      - generate_video
    9:  # HIGH 危险工具 (2 个)
      - send_notification
      - run_script
    10: # IRREVERSIBLE 终极能力 (4 个)
      - kill_process
      - lock_screen
      - set_wifi
      - set_bluetooth
  mcp_default_level: 8              # MCP server 注册的外部工具默认锁 Lv8
  rewards_title:
    1:  "Lv.1 时刻陪伴"
    2:  "Lv.2 解锁联网 + 信息获取"
    3:  "Lv.3 解锁系统控制 + 提醒"
    4:  "Lv.4 解锁文件编辑"
    5:  "Lv.5 解锁记忆管理 + 子任务"
    6:  "Lv.6 解锁倒计时"
    7:  "Lv.7 解锁图片/音频生成"
    8:  "Lv.8 解锁视频生成 + 外部扩展 (MCP)"
    9:  "Lv.9 解锁系统通知 + 脚本执行"
    10: "Lv.10 全部能力已解锁 (含危险工具)"
  celebrate:                        # 真实升级时桌宠在气泡里发的祝贺语
    1:  "我已上线,时刻陪主人!"
    2:  "主人,我学会上网啦,想查什么都可以问我!"
    3:  "音量亮度剪贴板我都掌握了,主人随时吩咐~"
    4:  "我学会改文件啦,主人让我改什么都行!"
    5:  "记忆小本本我可以自己改了,还能派小助手帮我干活~"
    6:  "倒计时搞定,主人说几点我就几点提醒!"
    7:  "主人想看图?想听音乐?我都给你做!"
    8:  "视频生成和外接工具上线,主人玩得更尽兴!"
    9:  "系统通知和脚本执行我都学会了,小心用哦~"
    10: "主人,我们一起走到了最高等级,什么都能做,但也请谨慎使用危险工具哦~"

# 工具白名单 (Stage 3.1) —— 执行期第三道闸
# 姿态: 存量工具默认放行, 增量工具默认拒绝。
#   - 存量(本表列出的 61 个内置工具)默认放行;
#   - 增量(此后新增的任何工具)默认拒绝, 必须显式登记进本表才可用。
# 两级形式: exact(精确名) + prefixes(前缀桶, 本项目自带的 MCP 命名空间)。
# 闸在 app/engine/tools/_core.py::execute() 里, 模型硬点名也拦得住。
#
# ⚠️ 新增内置工具时, 必须在这里补一行, 否则它会被执行期拒绝。
