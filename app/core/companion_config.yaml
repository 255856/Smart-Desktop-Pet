    - get_brightness
    - get_clipboard
    - get_current_time
    - get_pet_status
    - get_tts_mute_status
    - get_volume
    - get_weather
    - glob_files
    - grep_files
    - kill_process
    - list_countdowns
    - list_desktop_files
    - list_installed_apps
    - list_processes
    - list_reminders
    - lock_screen
    - multi_edit
    - ocr_image
    - open_app
    - open_file_explorer
    - open_notepad
    - open_terminal
    - open_website
    - play_animation
    - read_file
    - read_text_file
    - recall_memory
    - remember_fact
    - run_script
    - say_to_user
    - search_files
    - send_notification
    - set_bluetooth
