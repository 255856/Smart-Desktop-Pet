name: Tests

# 触发：master push + PR（任意目标分支）
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (PyQt5 offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install PyQt5 PyQtWebEngine pytest pytest-cov

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -q --no-header \
            --cov=app --cov-report=term-missing \
            --cov-fail-under=25

      - name: Verify features (no GUI)
        run: |
          python scripts/verify_features.py --no-gui
