name: Tests

# 触发：master push + PR（任意目标分支）
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # 本项目是 Windows 桌面应用：Live2D/Qt 窗口、锁屏、Wi-Fi/蓝牙开关、
    # 剪贴板（pywin32）、WMI 亮度/电量、ASR 唤醒词等都依赖 Windows 专有 API。
    # 早先跑在 ubuntu-latest 上，约 1/3 测试直接导入失败，导致 CI 长期全红
    # （历史两次运行均为 failure）。改到真实目标平台上跑，不做任何跳过。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 已分四层（必需/建议/Windows/可选/开发）：
          # PyQt5、pydantic-settings、numpy 等必需项都在里面
          pip install -r requirements.txt
          # 建议层：Live2D 渲染，不装会自动降级为 PNG 帧动画
          pip install PyQtWebEngine

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q --no-header --cov=app --cov-report=term-missing --cov-fail-under=25

      - name: Verify features (no GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/verify_features.py --no-gui
