name: Deploy Live2D Demo to GitHub Pages

# 触发：master 分支 push 后自动部署；workflow_dispatch 支持手动触发
on:
  push:
    branches: [master]
    paths:
      - 'docs/demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

# 权限：让 GH Actions 能写 gh-pages 分支和开 Pages
permissions:
  contents: write
  pages: write
  id-token: write

# 防止旧部署还在跑
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build demo artifact
        run: |
          mkdir -p _demo
          cp docs/demo/index.html _demo/
          cp docs/demo/live2d-demo.js _demo/
          # serve.py 是给本地用的，不发布到 Pages；README/DEPLOY 也不发布
          # （_demo/ 整个目录会被上传到 gh-pages 根）

          # 把 hiyori_zh-Hans 也拷过去（33MB，Live2D 官方允许 demo 用）
          # 注：master 的 .gitignore 排除了 hiyori_zh-Hans/，但 gh-pages 分支独立，
          #     deploy 步骤绕过 .gitignore 直接复制。这样 GitHub Pages 部署版本能
          #     自动加载 Hiyori Pro 真模型（零配置）。
          if [ -d docs/demo/hiyori_zh-Hans ]; then
            echo "Including hiyori_zh-Hans (Live2D official sample, ~33MB)"
            cp -r docs/demo/hiyori_zh-Hans _demo/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
