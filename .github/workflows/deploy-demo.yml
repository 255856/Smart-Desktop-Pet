name: Deploy Live2D Demo to GitHub Pages

# 触发：master 分支 push 后自动部署；workflow_dispatch 支持手动触发
on:
  push:
    branches: [master]
    paths:
      - 'docs/demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

# 权限：pages + id-token 用于部署；只读取仓库内容（模型从 gh-pages 分支拉取，不回写）
permissions:
  contents: read
  pages: write
  id-token: write

# 防止旧部署还在跑
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout master（页面/逻辑源码）
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout gh-pages（取大模型 Hiyori / Miara）
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
        # 模型仅存放在 gh-pages 分支（不进 master），若该分支不存在也不阻断其余部署
        continue-on-error: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build demo artifact
        run: |
          set -e
          mkdir -p _demo/vendor

          # 页面与逻辑（master 最新版）
          cp main/docs/demo/index.html _demo/
          cp main/docs/demo/live2d-demo.js _demo/
          cp main/docs/demo/favicon.ico _demo/

          # 渲染库（必须，否则线上无法加载 PIXI / Cubism Core）
          cp main/docs/demo/vendor/pixi.min.js _demo/vendor/
          cp main/docs/demo/vendor/live2dcubismcore.min.js _demo/vendor/

          # 内置 Hiyori 模型（约 45MB，仅存在于 gh-pages 分支，保持 master 轻量）
          if [ -d pages/hiyori_zh-Hans ]; then
            echo "Including Hiyori from gh-pages branch"
            cp -r pages/hiyori_zh-Hans _demo/
          else
            echo "::warning::未在 gh-pages 分支找到 hiyori_zh-Hans，线上将无法零配置加载内置模型"
          fi

          # 内置 Miara 模型（约 39MB，仅存在于 gh-pages 分支）
          if [ -d pages/miara_en ]; then
            echo "Including Miara from gh-pages branch"
            cp -r pages/miara_en _demo/
          else
            echo "::warning::未在 gh-pages 分支找到 miara_en，线上将缺少 Miara 模型"
          fi

          # 功能对齐报告（附加静态页）
          cp main/docs/demo/FEATURE_ALIGNMENT.html _demo/ 2>/dev/null || true

          echo "---- _demo 目录结构 ----"
          du -sh _demo
          find _demo -maxdepth 2 -type d | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
